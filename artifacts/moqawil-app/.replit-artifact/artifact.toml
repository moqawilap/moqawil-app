kind = "mobile"
previewPath = "/"
title = "Moqawil Oman Marketplace"
description = "A bilingual Oman marketplace connecting people with trusted contractors, engineering consultants, real estate opportunities, and home maintenance services based on their current location."
version = "1.0.0"
id = "artifacts/moqawil-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18166

[services.development]
run = "pnpm --filter @workspace/moqawil-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moqawil-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/moqawil-app", "run", "serve" ]

[services.env]
PORT = "18166"
BASE_PATH = "/"
